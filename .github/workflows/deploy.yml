name: Deploy ESUcodes to VDS

on:
  push:
    branches: [ "main" ] # Eğer ana dalın master ise burayı master yap!

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Sunucuya Bağlan ve Güncelle
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            # 1. Reponun içine gir ve yeni kodları çek
            cd ~/esucodes_web/bridge_app
            git pull origin main
            
            # 2. Ana dizine dön ve Docker'ı yeniden inşa et
            cd ~/esucodes_web
            sudo docker compose up -d --build